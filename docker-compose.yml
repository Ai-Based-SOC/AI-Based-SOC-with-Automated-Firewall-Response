services:
  mongo:
    image: mongo:7
    container_name: ai-soc-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: ai-soc-backend
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: ai_soc_firewall
      SECRET_KEY: replace-this-in-production
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      - mongo

volumes:
  mongo_data: